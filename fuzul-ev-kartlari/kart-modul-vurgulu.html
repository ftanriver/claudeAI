<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Fuzul Ev Kart Modül Vurgulu</title>
<link rel="stylesheet" href="ortak.css">
<link rel="stylesheet" href="modul.css">
<style>
  /* Modül (341 × 277) için aylık taksiti öne çıkaran yerleşim. */
  .hero {
    margin-top: 10px; padding: 10px 12px 11px; border-radius: 9px; background: #EFF9FA;
    display: grid; grid-template-columns: 1fr 1px auto; align-items: baseline;
  }
  .hero .ayrac { grid-row: 1 / 3; grid-column: 2; align-self: stretch; background: #CDE8EB; }
  .hero .k { font-size: 10.5px; font-weight: 700; color: var(--teal); }
  .hero .v { padding-top: 5px; font-size: 24px; font-weight: 700; line-height: 1; color: var(--ink-total); }
  .hero .yan { grid-column: 3; padding-left: 14px; }
  .hero .v.yan { font-size: 16px; color: var(--ink-value); }
  .rows { margin-top: 2px; }
  .row { height: 29px; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <img class="logo" src="assets/fuzul-logo.png" alt="fuzul">
    <div class="brand"><h1>Fuzul Ev</h1><p>BDDK Lisanslı</p></div>
    <div class="badge"><i data-ikon></i><span data-alan="rozet"></span></div>
  </div>
  <div class="hero">
    <p class="k">Aylık Taksit</p>
    <i class="ayrac"></i>
    <p class="k yan">Vade</p>
    <p class="v" data-alan="taksitTutari"></p>
    <p class="v yan" data-alan="vade"></p>
  </div>
  <div class="rows">
    <div class="row"><span class="k">Finans Bedeli</span><span class="v" data-alan="finansBedeli"></span></div>
    <div class="row"><span class="k">Organizasyon Bedeli</span><span class="v" data-alan="organizasyonBedeli"></span></div>
    <div class="row total"><span class="k">Toplam Ödeme</span><span class="v" data-alan="toplamOdeme"></span></div>
  </div>
  <div class="cta"><i data-ikon="kalkan"></i><span data-alan="buton"></span></div>
</div>
<script src="kartlar.js"></script>
<script src="ortak.js"></script>
</body>
</html>
