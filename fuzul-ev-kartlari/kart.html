<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Fuzul Ev Kart</title>
<link rel="stylesheet" href="ortak.css">
<style>
  /* Klasik yerleşim: referans görselin birebir karşılığı (760 × 708 CSS px, butonsuz 574). */
  .card { width: 760px; padding: 40.5px 44px 30px; }
  .card:has(.cta) { padding-bottom: 44px; }
  .rows { margin-top: 33.5px; }
  .row {
    height: 72px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .row span { position: relative; }
  .row .k { font-size: 23.5px; color: var(--label); top: 1px; }
  .row .v { font-size: 24.5px; font-weight: 700; color: var(--ink-value); top: 2px; }
  .row.total { height: 71px; border-bottom: 0; }
  .row.total .k { font-size: 23px; font-weight: 700; color: var(--label-total); top: 2px; }
  .row.total .v { font-size: 28.5px; color: var(--ink-total); top: 3px; }
  .cta { margin-top: 28px; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <img class="logo" src="assets/fuzul-logo.png" alt="fuzul">
    <div class="brand"><h1>Fuzul Ev</h1><p>BDDK Lisanslı</p></div>
    <div class="badge"><i data-ikon></i><span data-alan="rozet"></span></div>
  </div>
  <div class="rows">
    <div class="row"><span class="k">Finans Bedeli</span><span class="v" data-alan="finansBedeli"></span></div>
    <div class="row"><span class="k">Vade</span><span class="v" data-alan="vade"></span></div>
    <div class="row"><span class="k">Taksit Tutarı</span><span class="v" data-alan="taksitTutari"></span></div>
    <div class="row"><span class="k">Organizasyon Bedeli</span><span class="v" data-alan="organizasyonBedeli"></span></div>
    <div class="row total"><span class="k">Toplam Ödeme</span><span class="v" data-alan="toplamOdeme"></span></div>
  </div>
  <div class="cta"><i data-ikon="kalkan"></i><span data-alan="buton"></span></div>
</div>
<script src="kartlar.js"></script>
<script src="ortak.js"></script>
</body>
</html>
