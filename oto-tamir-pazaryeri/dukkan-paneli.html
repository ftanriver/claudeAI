<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dükkan Paneli · TamirPort</title>
<meta name="description" content="Kategorine ve bölgene düşen talepleri gör, teklif ver, işlerini ve hakedişlerini yönet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Figtree:wght@400..700&display=swap">
<link rel="stylesheet" href="assets/css/temel.css">
<link rel="stylesheet" href="assets/css/panel.css">
</head>
<body>
<div id="proto-serit" data-sayfa="dukkan"></div>

<div class="app">
  <aside class="app-yan" aria-label="Dükkan paneli menüsü">
    <a class="logo" href="index.html" aria-label="TamirPort ana sayfa"><i data-logo></i><span>Tamir<b>Port</b></span></a>
    <span class="app-rol">Dükkan paneli</span>
    <nav class="app-nav">
      <a href="#ozet" data-gorunum="ozet"><i data-ikon="layout-dashboard"></i>Özet</a>
      <a href="#talepler" data-gorunum="talepler"><i data-ikon="inbox"></i>Gelen talepler<span class="sayac" data-sayac="talepler"></span></a>
      <a href="#teklifler" data-gorunum="teklifler"><i data-ikon="send"></i>Tekliflerim</a>
      <a href="#isler" data-gorunum="isler"><i data-ikon="wrench"></i>Aktif işler<span class="sayac" data-sayac="isler"></span></a>
      <a href="#hakedis" data-gorunum="hakedis"><i data-ikon="wallet"></i>Hakedişler</a>
      <a href="#degerlendirmeler" data-gorunum="degerlendirmeler"><i data-ikon="star"></i>Değerlendirmeler</a>
      <a href="#profil" data-gorunum="profil"><i data-ikon="settings"></i>Profil ve ayarlar</a>
    </nav>
    <div class="app-yan-alt" id="yan-dukkan"></div>
  </aside>

  <div class="app-ana">
    <header class="app-ust">
      <a class="logo" href="index.html" aria-label="TamirPort ana sayfa"><i data-logo></i><span>Tamir<b>Port</b></span></a>
      <div class="app-baslik"><h1 id="gorunum-baslik">Özet</h1><p id="gorunum-alt"></p></div>
      <div class="app-ust-sag">
        <label class="switch" title="Kapasiten dolduğunda kapat; yeni talep almazsın"><input type="checkbox" id="teklif-acik" checked><span>Teklif almaya açık</span></label>
        <button type="button" class="icon-btn bildirim gizle-mobil" aria-label="Bildirimler" data-git="talepler"><i data-ikon="bell"></i></button>
        <span id="ust-logo"></span>
      </div>
    </header>
    <main class="app-icerik" id="gorunum" aria-live="polite"></main>
  </div>
</div>

<nav class="app-alt-nav" aria-label="Panel menüsü">
  <a href="#ozet" data-gorunum="ozet"><i data-ikon="layout-dashboard"></i>Özet</a>
  <a href="#talepler" data-gorunum="talepler"><i data-ikon="inbox"></i>Talepler</a>
  <a href="#isler" data-gorunum="isler"><i data-ikon="wrench"></i>İşler</a>
  <a href="#hakedis" data-gorunum="hakedis"><i data-ikon="wallet"></i>Hakediş</a>
  <button type="button" data-diger-menu><i data-ikon="menu"></i>Diğer</button>
</nav>

<script src="assets/js/ikonlar.js"></script>
<script src="assets/js/veri.js"></script>
<script src="assets/js/ortak.js"></script>
<script src="assets/js/dukkan.js"></script>
</body>
</html>
